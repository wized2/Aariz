name: CI

on:
  push:
    branches: [main, beta]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main, beta]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Unit tests, debug build, minified release build
        run: |
          chmod +x gradlew
          # No signing secrets here on purpose: CI builds are debug-signed. Real releases use release.yml.
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aariz-ci-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
