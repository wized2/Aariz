name: Release

# Publish a signed APK to GitHub Releases.
#   git tag v1.2.0 && git push origin v1.2.0
# The tag must match versionName in app/build.gradle.kts (v1.2.0 <-> "1.2.0").
# A tag with a hyphen (v1.2.0-beta.1) is published as a pre-release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v1.0.1'
        required: true
      allow_debug_signing:
        description: 'Publish even without signing secrets (debug-signed APK)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches versionName
        id: ver
        run: |
          NAME=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "versionName=$NAME"
          if [ "v$NAME" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $NAME in app/build.gradle.kts. Bump the version, then tag again."
            exit 1
          fi
          echo "version=$NAME" >> "$GITHUB_OUTPUT"
          case "$TAG" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT" ;; *) echo "pre=false" >> "$GITHUB_OUTPUT" ;; esac

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Decode release keystore
        id: keys
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ALLOW_DEBUG: ${{ github.event.inputs.allow_debug_signing }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${RELEASE_STORE_PASSWORD:-}" ] \
             && [ -n "${RELEASE_KEY_PASSWORD:-}" ] && [ -n "${RELEASE_KEY_ALIAS:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$ALLOW_DEBUG" = "true" ]; then
            echo "::warning::No signing secrets. Publishing a debug-signed APK because you asked for it."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing signing secrets (RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD). Add them under Settings > Secrets and variables > Actions, or re-run manually with allow_debug_signing."
            exit 1
          fi

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keys.outputs.signed }}" = "true" ]; then
            export RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Verify signature and name the APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$SRC"
          if [ "${{ steps.keys.outputs.signed }}" = "true" ]; then
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$APKSIGNER" verify --verbose "$SRC"
          fi
          DEST="Aariz-${TAG}.apk"
          cp "$SRC" "$DEST"
          sha256sum "$DEST" > "$DEST.sha256"
          ls -lah "$DEST" "$DEST.sha256"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Aariz ${{ env.TAG }}
          prerelease: ${{ steps.ver.outputs.pre == 'true' }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          body: |
            Native Android AI chat by Project Endroid.

            **Install:** download `${{ steps.apk.outputs.path }}` below. Verify it with the attached `.sha256` file (`sha256sum -c`).
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
